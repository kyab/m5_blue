; Default firmware env uses pioarduino platform tag 51.03.07: Arduino-ESP32 3.0.7 on ESP-IDF 5.1.4+
; (Bluetooth Delay Reporting APIs require this line). AudioTools uses the new I2S driver on IDF 5.
;
; Legacy PlatformIO + Arduino 2.x / IDF 4.4.x definitions are kept as *-old envs only (not built by CI
; unless selected); they may fail to resolve or compile as the project moves forward.

[platformio]
default_envs = m5stack-core2

[env:m5stack-core2]
platform = https://github.com/pioarduino/platform-espressif32.git#51.03.07
board = m5stack-core2
framework = arduino

monitor_speed = 115200
; Reset while monitoring: Ctrl+T then R (toggle RTS) or Ctrl+T then D (toggle DTR).
; One of these usually resets ESP32/M5Stack so you can see boot log again.
monitor_filters = esp32_exception_decoder, time, log2file
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-mfix-esp32-psram-cache-issue
lib_deps =
	m5stack/M5Unified
	; Pinned: newer audio-tools uses I2S_MCLK_MULTIPLE_192 (not in ESP32 IDF 5.1 i2s_types.h).
	https://github.com/pschatzmann/arduino-audio-tools.git#86b28ad088

; Module-Audio: submodule (custom branch) with ES8388 init pop mitigation. ESP32-A2DP: submodule (custom).
lib_extra_dirs =
	${PROJECT_DIR}/ESP32-A2DP
	${PROJECT_DIR}/Module-Audio

build_src_filter = +<*> -<main_noise_test.cpp>

build_type = debug

; Legacy: official espressif32 @ 6.8.1 + Arduino 2.x / IDF 4.4.x (kept for reference only).
[env:m5stack-core2-old]
platform = espressif32 @ 6.8.1
board = m5stack-core2
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, log2file
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-mfix-esp32-psram-cache-issue
lib_deps =
	m5stack/M5Unified
	https://github.com/pschatzmann/arduino-audio-tools.git
	https://github.com/m5stack/M5Unit-Joystick2.git

lib_extra_dirs =
	${PROJECT_DIR}/ESP32-A2DP
	${PROJECT_DIR}/Module-Audio

build_src_filter = +<*> -<main_noise_test.cpp>

build_type = debug

; Noise-floor test env. Builds only src/main_noise_test.cpp, with BLE/A2DP/Wi-Fi
; left uninitialised (and explicitly disabled at runtime). Plays 1 kHz sine, zero,
; sine, +-1 LSB dither in 2s segments. Use to A/B compare USB vs battery power.
[env:m5stack-core2-noise-test]
platform = https://github.com/pioarduino/platform-espressif32.git#51.03.07
board = m5stack-core2
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, log2file
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-DNOISE_TEST_BUILD=1
	-mfix-esp32-psram-cache-issue
lib_deps =
	m5stack/M5Unified
	https://github.com/pschatzmann/arduino-audio-tools.git#86b28ad088

lib_extra_dirs =
	${PROJECT_DIR}/Module-Audio

build_src_filter = -<*> +<main_noise_test.cpp>

build_type = debug

[env:m5stack-core2-noise-test-old]
platform = espressif32 @ 6.8.1
board = m5stack-core2
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, log2file
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-DNOISE_TEST_BUILD=1
	-mfix-esp32-psram-cache-issue
lib_deps =
	m5stack/M5Unified
	https://github.com/pschatzmann/arduino-audio-tools.git

lib_extra_dirs =
	${PROJECT_DIR}/Module-Audio

build_src_filter = -<*> +<main_noise_test.cpp>

build_type = debug
